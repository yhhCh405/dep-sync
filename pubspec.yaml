name: dep_sync
description: A CLI to clone Git dependencies for Dart and Flutter apps, check out the versions in pubspec.yaml, and save local package commits back to it.
version: 0.2.3
repository: https://github.com/yhhCh405/dep-sync
homepage: https://yehtethein.dev
issue_tracker: https://github.com/yhhCh405/dep-sync/issues

environment:
  sdk: ^3.6.0

executables:
  dep-sync: dep_sync
  dep-pull: dep_pull
  dep-push: dep_push

platforms:
  linux:
  macos:
  windows:

topics:
  - cli
  - git
  - dependencies
  - workspace

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  pub_semver: ^2.1.4
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.0
