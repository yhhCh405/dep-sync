name: dep_sync
description: Synchronize Git dependency checkouts across Dart and Flutter repositories, ignore selected packages, and pin local commits without changing SDK configuration.
version: 0.1.0
repository: https://github.com/yhhCh405/dep-sync
homepage: https://yehtethein.dev
issue_tracker: https://github.com/yhhCh405/dep-sync/issues

environment:
  sdk: ^3.6.0

executables:
  dep-sync: dep_sync
  dep-pull: dep_pull
  dep-push: dep_push

platforms:
  linux:
  macos:
  windows:

topics:
  - cli
  - git
  - dependencies
  - workspace

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.0
