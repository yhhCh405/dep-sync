name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Dart ${{ matrix.sdk }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: ['3.6.2', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Check release decision logic
        if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/local_demo.dart
      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed bin lib test example
      - name: Verify package
        if: matrix.sdk == 'stable' && matrix.os == 'ubuntu-latest'
        run: dart pub publish --dry-run
      - name: Verify global installation
        env:
          PUB_CACHE: ${{ runner.temp }}/dep-sync-pub-cache
        run: |
          dart pub global activate --source path .
          dart pub global run dep_sync:dep_sync --version
          dart pub global run dep_sync:dep_pull --help
          dart pub global run dep_sync:dep_push --help

  release-tag:
    name: Tag unpublished version after main passes CI
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # A PAT is required: tags pushed by GITHUB_TOKEN do not trigger CI.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Check whether this version is already published
        id: release
        run: python3 .github/scripts/release_version.py
      - name: Create immutable version tag
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::notice::Tag $RELEASE_TAG already exists; skipping tag creation. Retry its failed tag workflow run to publish."
            exit 0
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Configure RELEASE_TOKEN with repository Contents read/write access so tag pushes trigger the publishing workflow.'
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

  publish:
    name: Publish validated version tag to pub.dev
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag matches the package version and main history
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git merge-base --is-ancestor HEAD origin/main
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
